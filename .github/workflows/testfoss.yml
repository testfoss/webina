name: testfoss

on:
  push:
    branches: [testfoss-demo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testfoss-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  archived-build-and-docking:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the additive fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install upstream dependencies
        run: npm ci
      - name: Build the unmodified archived UI on Linux
        run: |
          mkdir -p "$RUNNER_TEMP/testfoss-bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/testfoss-bin/say"
          chmod +x "$RUNNER_TEMP/testfoss-bin/say"
          PATH="$RUNNER_TEMP/testfoss-bin:$PATH" npm run build
      - name: Install browser-test tools
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.469
          lmscript install github:lmctl-ai/lmwebtest@v0.1.10
          echo "$HOME/.cache/lmscript/tools/github/lmctl-ai/lmwebtest/v0.1.10" >> "$GITHUB_PATH"
          npm ci --prefix testfoss
          npm run --prefix testfoss browsers:install
      - name: Check prebuilt Vina provenance
        run: |
          test -s src/Webina/vina.wasm
          test -s dist/Webina/vina.wasm
          cmp src/Webina/vina.wasm dist/Webina/vina.wasm
          sha256sum src/Webina/vina.wasm
      - name: Run stock example docking through lmwebtest
        env:
          TESTFOSS_URL: http://127.0.0.1:8000
        run: |
          python3 testfoss/server.py --root . --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          lmwebtest --version
          export TESTFOSS_CHROMIUM="$(node --input-type=module -e "import { chromium } from './testfoss/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")"
          lmscript testfoss/browser.lms
